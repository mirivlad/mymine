name: mymine

services:
  world-config:
    image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    restart: "no"
    environment:
      MYMINE_EDITION: "${MYMINE_EDITION:-classic}"
      DATA_DIR: "${DATA_DIR:-./data}"
      MYMINE_WORLDS_ROOT: "${MYMINE_WORLDS_ROOT:-.}"
    volumes:
      - "${MYMINE_WORLDS_ROOT:-.}:/worlds"
    command:
      - /bin/sh
      - -ec
      - |
        case "$${MYMINE_EDITION}" in classic|engineering) ;; *)
          echo "MYMINE_EDITION must be classic or engineering" >&2; exit 1 ;;
        esac
        case "$${DATA_DIR}" in
          "$${MYMINE_WORLDS_ROOT}/data") ;;
          *) echo "DATA_DIR must equal MYMINE_WORLDS_ROOT/data; refusing to move a world" >&2; exit 1 ;;
        esac
        if [ -L /worlds/data-classic ]; then
          [ "$(readlink /worlds/data-classic)" = "data" ] || {
            echo "Unexpected data-classic symlink; refusing to overwrite" >&2; exit 1;
          }
        elif [ -e /worlds/data-classic ]; then
          echo "data-classic already exists and is not a protected old world link" >&2; exit 1
        else
          if [ ! -d /worlds/data ]; then
            echo "No classic world found in configured directory; creating a NEW empty classic world" >&2
            mkdir -p /worlds/data
          fi
          ln -s data /worlds/data-classic
        fi
        [ ! -L /worlds/data-engineering ] || {
          echo "data-engineering cannot be a symlink" >&2; exit 1;
        }
        mkdir -p /worlds/data-engineering
        echo "MyMine edition=$${MYMINE_EDITION}; classic save preserved; Engineering isolated"

  auth-config:
    image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    restart: "no"
    environment:
      AUTH_DOMAIN: "${AUTH_DOMAIN:?AUTH_DOMAIN is required}"
      AUTH_BASE_URL: "${AUTH_BASE_URL:?AUTH_BASE_URL is required}"
      AUTH_INSTANCE_NAME: "${AUTH_INSTANCE_NAME:-MyMine}"
      DRASL_ADMIN: "${DRASL_ADMIN:?DRASL_ADMIN is required; choose the initial Drasl admin username}"
      VERIFY_MINECRAFT_OWNERSHIP: "${VERIFY_MINECRAFT_OWNERSHIP:-true}"
      DRASL_REQUIRE_INVITE: "${DRASL_REQUIRE_INVITE:-true}"
    volumes:
      - "${AUTH_DATA_DIR:-./auth-data}/config:/out"
    command:
      - /bin/sh
      - -ec
      - |
        case "$${VERIFY_MINECRAFT_OWNERSHIP}" in
          true|false) ;;
          *) echo "VERIFY_MINECRAFT_OWNERSHIP must be true or false" >&2; exit 1 ;;
        esac
        case "$${DRASL_REQUIRE_INVITE}" in
          true|false) ;;
          *) echo "DRASL_REQUIRE_INVITE must be true or false" >&2; exit 1 ;;
        esac

        cat > /out/config.toml <<EOF
        Domain = "$${AUTH_DOMAIN}"
        BaseURL = "$${AUTH_BASE_URL}"
        InstanceName = "$${AUTH_INSTANCE_NAME}"
        DefaultAdmins = ["$${DRASL_ADMIN}"]
        PlayerUUIDGeneration = "offline"
        SignPublicKeys = false
        EnableWebFrontEnd = true
        PreMigrationBackups = true
        EOF

        if [ "$${VERIFY_MINECRAFT_OWNERSHIP}" = "true" ]; then
          cat >> /out/config.toml <<EOF
        [CreateNewPlayer]
        Allow = false

        [[FallbackAPIServers]]
        Nickname = "Mojang"
        DiscoveryMinecraftClientURL = "https://discovery.minecraftservices.com/minecraft/client"
        ForwardSkins = true
        SetSkinURL = "https://www.minecraft.net/msaprofile/mygames/editskin"
        CacheTTLSeconds = 60
        DenyUnknownUsers = true

        [RegistrationUsernamePassword.CreateNewPlayer]
        Allow = false

        [[RegistrationUsernamePassword.ImportExistingPlayer]]
        FallbackAPIServerNickname = "Mojang"
        RequireSkinVerification = true
        RequireInvite = $${DRASL_REQUIRE_INVITE}
        EOF
        else
          cat >> /out/config.toml <<EOF
        [CreateNewPlayer]
        Allow = true

        [RegistrationUsernamePassword.CreateNewPlayer]
        Allow = true
        RequireInvite = $${DRASL_REQUIRE_INVITE}
        EOF
        fi

  bluemap-config:
    image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    restart: "no"
    environment:
      BLUEMAP_ACCEPT_DOWNLOAD: "${BLUEMAP_ACCEPT_DOWNLOAD:-false}"
      BLUEMAP_RENDER_THREADS: "${BLUEMAP_RENDER_THREADS:-1}"
      BLUEMAP_METRICS: "${BLUEMAP_METRICS:-false}"
      BLUEMAP_UID: "${BLUEMAP_UID:-1000}"
      BLUEMAP_GID: "${BLUEMAP_GID:-1000}"
    volumes:
      - "${DATA_DIR:-./data}/config/bluemap:/out"
    command:
      - /bin/sh
      - -ec
      - |
        cat > /out/core.conf <<EOF
        accept-download: $${BLUEMAP_ACCEPT_DOWNLOAD}
        render-thread-count: $${BLUEMAP_RENDER_THREADS}
        metrics: $${BLUEMAP_METRICS}
        EOF
        chown -R "$${BLUEMAP_UID}:$${BLUEMAP_GID}" /out

  drasl:
    image: unmojang/drasl@sha256:0501cd6e3ecf591be6b4d32120832a98b79b5162d61205310e49f30b2a414c02
    container_name: ${AUTH_CONTAINER_NAME:-mymine-auth}
    restart: unless-stopped
    depends_on:
      auth-config:
        condition: service_completed_successfully
    ports:
      - "${WEB_BIND_ADDR:-127.0.0.1}:${AUTH_PORT:-25585}:25585/tcp"
    volumes:
      - "${AUTH_DATA_DIR:-./auth-data}/config:/etc/drasl:ro"
      - "${AUTH_DATA_DIR:-./auth-data}/data:/var/lib/drasl"
    mem_limit: "${AUTH_MEMORY_LIMIT:-384m}"

  landing:
    image: ${LANDING_IMAGE:-ghcr.io/mirivlad/mymine-landing}:${IMAGE_TAG:-latest}
    container_name: ${LANDING_CONTAINER_NAME:-mymine-landing}
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDR:-127.0.0.1}:${LANDING_PORT:-8080}:80/tcp"
    environment:
      MYMINE_EDITION: "${MYMINE_EDITION:-classic}"
      AUTH_BASE_URL: "${AUTH_BASE_URL:?AUTH_BASE_URL is required}"
      MC_ADDRESS: "${MC_ADDRESS:?MC_ADDRESS is required}"
      SERVER_NAME: "${SERVER_NAME:-MyMine}"
      MAP_URL: "${MAP_URL:-/map/}"
      LANDING_TEMPLATE: "${LANDING_TEMPLATE:-adventure}"
      LANDING_HERO_IMAGE: "${LANDING_HERO_IMAGE:-/assets/voxel-world.webp}"
      LANDING_GALLERY_IMAGE_1: "${LANDING_GALLERY_IMAGE_1:-/assets/isometric-world.webp}"
      LANDING_GALLERY_IMAGE_2: "${LANDING_GALLERY_IMAGE_2:-/assets/bluemap.webp}"
      LANDING_GALLERY_IMAGE_3: "${LANDING_GALLERY_IMAGE_3:-/assets/voxel-world.webp}"
      VERIFY_MINECRAFT_OWNERSHIP: "${VERIFY_MINECRAFT_OWNERSHIP:-true}"
    volumes:
      - "${LANDING_ASSETS_DIR:-./landing-assets}:/usr/share/nginx/html/custom:ro"
    mem_limit: "${LANDING_MEMORY_LIMIT:-128m}"

  minecraft:
    image: ${IMAGE:-ghcr.io/mirivlad/mymine}:${MYMINE_EDITION:-classic}-${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-mymine}
    restart: unless-stopped
    depends_on:
      world-config:
        condition: service_completed_successfully
      drasl:
        condition: service_started
      bluemap-config:
        condition: service_completed_successfully
    ports:
      - "${MC_PORT:-25565}:25565/tcp"
      - "${MC_PORT:-25565}:25565/udp"
      - "${WEB_BIND_ADDR:-127.0.0.1}:${MAP_PORT:-8100}:8100/tcp"
    environment:
      MYMINE_EDITION: "${MYMINE_EDITION:-classic}"
      MYMINE_DAY_MINUTES: "${MYMINE_DAY_MINUTES:-20}"
      MYMINE_NIGHT_MINUTES: "${MYMINE_NIGHT_MINUTES:-10}"
      EULA: "TRUE"
      TZ: "${TZ:-UTC}"
      MEMORY: "${MEMORY:-4G}"
      SERVER_NAME: "${SERVER_NAME:-MyMine}"
      MOTD: "${MOTD:-MyMine — Minecraft {version}}"
      MODE: "${MODE:-survival}"
      DIFFICULTY: "${DIFFICULTY:-normal}"
      MAX_PLAYERS: "${MAX_PLAYERS:-20}"
      ONLINE_MODE: "true"
      ENFORCE_SECURE_PROFILE: "false"
      ENABLE_WHITELIST: "${ENABLE_WHITELIST:-false}"
      ENFORCE_WHITELIST: "${ENFORCE_WHITELIST:-false}"
      PVP: "${PVP:-true}"
      VIEW_DISTANCE: "${VIEW_DISTANCE:-10}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-8}"
      SPAWN_PROTECTION: "${SPAWN_PROTECTION:-0}"
      ENABLE_COMMAND_BLOCK: "${ENABLE_COMMAND_BLOCK:-false}"
      ALLOW_FLIGHT: "${ALLOW_FLIGHT:-true}"
      ENABLE_RCON: "${ENABLE_RCON:-false}"
      JVM_OPTS: >-
        -Dminecraft.api.env=custom
        -Dminecraft.api.auth.host=http://drasl:25585/auth
        -Dminecraft.api.account.host=http://drasl:25585/account
        -Dminecraft.api.profiles.host=http://drasl:25585/account
        -Dminecraft.api.session.host=http://drasl:25585/session
        -Dminecraft.api.services.host=http://drasl:25585/services
        -Dminecraft.api.discovery.host=http://drasl:25585/discovery/minecraft/client
    volumes:
      - "${MYMINE_WORLDS_ROOT:-.}/data-${MYMINE_EDITION:-classic}:/data"
    mem_limit: "${CONTAINER_MEMORY_LIMIT:-6g}"
    stop_grace_period: 2m
