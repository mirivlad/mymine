name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        env:
          AUTH_DOMAIN: auth.example.org
          AUTH_BASE_URL: https://auth.example.org
          MC_ADDRESS: mc.example.org:25565
        run: docker compose -f compose.yml config >/dev/null

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build MyMine Launcher
        env:
          HMCL_VERSION: '3.16.3'
          MYMINE_AUTH_URL: https://auth.example.org/
          DIST_DIR: ${{ runner.temp }}/mymine-launcher
        run: ./launcher/build.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            context: .
            tag: mymine:ci
          - name: landing
            context: ./landing
            tag: mymine-landing:ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: ${{ matrix.tag }}
