name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        env:
          AUTH_DOMAIN: auth.example.org
          AUTH_BASE_URL: https://auth.example.org
          DRASL_ADMIN: ci-admin
          MC_ADDRESS: mc.example.org:25565
        run: docker compose -f compose.yml config >/dev/null

  auth:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        verify: ['true', 'false']
    env:
      AUTH_DOMAIN: localhost
      AUTH_BASE_URL: http://localhost:25585
      DRASL_ADMIN: ci-admin
      MC_ADDRESS: mc.example.org:25565
      AUTH_PORT: '25585'
      WEB_BIND_ADDR: 127.0.0.1
      AUTH_CONTAINER_NAME: mymine-auth-ci
      VERIFY_MINECRAFT_OWNERSHIP: ${{ matrix.verify }}
      DRASL_REQUIRE_INVITE: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Start Drasl (${{ matrix.verify == 'true' && 'verified ownership' || 'independent registration' }})
        env:
          AUTH_DATA_DIR: ${{ runner.temp }}/mymine-auth-${{ matrix.verify }}
        run: |
          set -euo pipefail
          cleanup() {
            docker compose logs auth-config drasl || true
            docker compose down --remove-orphans || true
          }
          trap cleanup EXIT

          docker compose up -d drasl

          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:25585/ >/dev/null; then
              ready=true
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' mymine-auth-ci 2>/dev/null | grep -q true; then
              break
            fi
            sleep 1
          done
          test "$ready" = true

          config="$AUTH_DATA_DIR/config/config.toml"
          test -s "$config"
          if [[ "$VERIFY_MINECRAFT_OWNERSHIP" == true ]]; then
            grep -q '^\[ImportExistingPlayer\]' "$config"
            grep -q '^RequireSkinVerification = true$' "$config"
            grep -q '^\[RegistrationExistingPlayer\]' "$config"
            awk '/^\[RegistrationNewPlayer\]/{seen=1; next} seen && /^Allow = false$/{found=1; exit} END{exit !found}' "$config"
          else
            ! grep -q '^\[ImportExistingPlayer\]' "$config"
            ! grep -q '^RequireSkinVerification = true$' "$config"
            awk '/^\[RegistrationNewPlayer\]/{seen=1; next} seen && /^Allow = true$/{found=1; exit} END{exit !found}' "$config"
          fi

          curl -fsS --max-time 5 http://127.0.0.1:25585/ >/dev/null
          trap - EXIT
          cleanup

  server-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTH_DOMAIN: localhost
      AUTH_BASE_URL: http://localhost:25585
      DRASL_ADMIN: ci-admin
      AUTH_PORT: '25585'
      AUTH_CONTAINER_NAME: mymine-auth-smoke
      VERIFY_MINECRAFT_OWNERSHIP: 'false'
      DRASL_REQUIRE_INVITE: 'false'
      MC_ADDRESS: localhost:25565
      CONTAINER_NAME: mymine-test
      WEB_BIND_ADDR: 127.0.0.1
      BLUEMAP_ACCEPT_DOWNLOAD: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Boot Minecraft with public mod set
        env:
          AUTH_DATA_DIR: ${{ runner.temp }}/mymine-auth-smoke
          DATA_DIR: ${{ runner.temp }}/mymine-data-smoke
        run: |
          set -euo pipefail
          cleanup() {
            docker compose -f compose.yml -f compose.dev.yml logs minecraft drasl || true
            docker compose -f compose.yml -f compose.dev.yml down --remove-orphans || true
          }
          trap cleanup EXIT
          ./scripts/smoke-test.sh
          trap - EXIT
          cleanup

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build MyMine Launcher
        env:
          HMCL_VERSION: '3.16.3'
          MYMINE_AUTH_URL: https://auth.example.org/
          MYMINE_SERVER_NAME: MyMine CI
          MYMINE_SERVER_ADDRESS: mc.example.org:25565
          DIST_DIR: ${{ runner.temp }}/mymine-launcher
        run: ./launcher/build.sh
      - name: Verify launcher branding and embedded instance defaults
        run: |
          set -euo pipefail
          dist="${RUNNER_TEMP}/mymine-launcher"
          props=$(python3 -c 'import sys,zipfile; print(zipfile.ZipFile(sys.argv[1]).read("mymine-instance.properties").decode(), end="")' "$dist/MyMineLauncher-3.16.3.jar")
          grep -q '^auth.url=https://auth.example.org/$' <<<"$props"
          grep -q '^server.name=MyMine CI$' <<<"$props"
          grep -q '^server.address=mc.example.org:25565$' <<<"$props"

          deb="$dist/MyMineLauncher-3.16.3.deb"
          test "$(dpkg-deb -f "$deb" Package)" = mymine-launcher
          test "$(dpkg-deb -f "$deb" Description | head -1)" = 'MyMine Launcher'
          root="${RUNNER_TEMP}/mymine-deb-root"
          rm -rf "$root"
          dpkg-deb -x "$deb" "$root"
          test -x "$root/usr/bin/mymine-launcher"
          test -f "$root/usr/share/applications/mymine-launcher.desktop"
          grep -q '^Name=MyMine Launcher$' "$root/usr/share/applications/mymine-launcher.desktop"
          test -f "$root/usr/share/java/mymine-launcher/MyMineLauncher-3.16.3.sh"

      - name: Verify landing injects its own instance into every launcher artifact
        run: |
          set -euo pipefail
          dist="${RUNNER_TEMP}/mymine-launcher"
          cp "$dist"/* landing/downloads/
          docker build -t mymine-landing-instance-test landing
          cid=$(docker run -d \
            -e AUTH_BASE_URL=https://auth.fork.example \
            -e MC_ADDRESS=play.fork.example:25577 \
            -e SERVER_NAME='Fork Mine' \
            -e VERIFY_MINECRAFT_OWNERSHIP=false \
            mymine-landing-instance-test)
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            if docker exec "$cid" test -s /usr/share/nginx/html/server.json 2>/dev/null; then
              ready=true
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null | grep -q true; then
              docker logs "$cid" || true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker logs "$cid"

          out="${RUNNER_TEMP}/mymine-instance-downloads"
          rm -rf "$out" && mkdir -p "$out"
          docker cp "$cid:/usr/share/nginx/html/downloads/." "$out/"

          for ext in exe jar sh; do
            artifact="$out/MyMineLauncher-3.16.3.$ext"
            props=$(python3 -c 'import sys,zipfile; print(zipfile.ZipFile(sys.argv[1]).read("mymine-instance.properties").decode(), end="")' "$artifact")
            grep -q '^auth.url=https://auth.fork.example/$' <<<"$props"
            grep -q '^server.name=Fork Mine$' <<<"$props"
            grep -q '^server.address=play.fork.example:25577$' <<<"$props"
          done
          python3 - "$out" <<'PY_HEADERS'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          assert (root / "MyMineLauncher-3.16.3.exe").read_bytes().startswith(b"MZ")
          assert (root / "MyMineLauncher-3.16.3.sh").read_bytes().startswith(b"#!/")
          assert (root / "MyMineLauncher-3.16.3.jar").read_bytes().startswith(b"PK\x03\x04")
          PY_HEADERS

          debroot="${RUNNER_TEMP}/mymine-instance-deb"
          rm -rf "$debroot"
          dpkg-deb -x "$out/MyMineLauncher-3.16.3.deb" "$debroot"
          payload="$debroot/usr/share/java/mymine-launcher/MyMineLauncher-3.16.3.sh"
          test -x "$payload"
          props=$(python3 -c 'import sys,zipfile; print(zipfile.ZipFile(sys.argv[1]).read("mymine-instance.properties").decode(), end="")' "$payload")
          grep -q '^auth.url=https://auth.fork.example/$' <<<"$props"
          grep -q '^server.name=Fork Mine$' <<<"$props"
          grep -q '^server.address=play.fork.example:25577$' <<<"$props"

          (cd "$out" && sha256sum -c SHA256SUMS)
          trap - EXIT
          cleanup

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            context: .
            tag: mymine:ci
          - name: landing
            context: ./landing
            tag: mymine-landing:ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: ${{ matrix.tag }}
