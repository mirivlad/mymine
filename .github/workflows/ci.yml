name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        env:
          AUTH_DOMAIN: auth.example.org
          AUTH_BASE_URL: https://auth.example.org
          DRASL_ADMIN: ci-admin
          MC_ADDRESS: mc.example.org:25565
        run: |
          set -euo pipefail
          docker compose -f compose.yml config >/dev/null
          python3 -m unittest discover -s tests -v
          python3 engineering/validate.py
          for edition in classic engineering; do
            MYMINE_EDITION="$edition" docker compose -f compose.yml config >/dev/null
            MYMINE_EDITION="$edition" docker compose -f deploy/portainer-stack.yml config >/dev/null
          done
          for edition in classic engineering; do
            tmp=$(mktemp -d)
            mkdir -p "$tmp/data/world"
            echo retained-world > "$tmp/data/world/level.dat"
            MYMINE_EDITION="$edition" MYMINE_WORLDS_ROOT="$tmp" DATA_DIR="$tmp/data"               docker compose -f compose.yml run --rm --no-deps world-config
            test "$(readlink "$tmp/data-classic")" = data
            test "$(cat "$tmp/data/world/level.dat")" = retained-world
            test -d "$tmp/data-engineering"
            rm -rf "$tmp"
          done
          docker compose -f compose.yml config --format json | jq -e '
            (.services.landing.environment | has("MC_VERSION") | not) and
            (.services.minecraft.environment | has("MC_VERSION") | not) and
            (.services.minecraft.environment.JVM_OPTS | contains("minecraft.api.discovery.host=http://drasl:25585/discovery/minecraft/client")) and
            (.services.drasl.image | contains("sha256:0501cd6e3ecf591be6b4d32120832a98b79b5162d61205310e49f30b2a414c02"))
          ' >/dev/null

  auth:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        verify: ['true', 'false']
    env:
      AUTH_DOMAIN: localhost
      AUTH_BASE_URL: http://localhost:25585
      DRASL_ADMIN: ci-admin
      MC_ADDRESS: mc.example.org:25565
      AUTH_PORT: '25585'
      WEB_BIND_ADDR: 127.0.0.1
      AUTH_CONTAINER_NAME: mymine-auth-ci
      VERIFY_MINECRAFT_OWNERSHIP: ${{ matrix.verify }}
      DRASL_REQUIRE_INVITE: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Start Drasl (${{ matrix.verify == 'true' && 'verified ownership' || 'independent registration' }})
        env:
          AUTH_DATA_DIR: ${{ runner.temp }}/mymine-auth-${{ matrix.verify }}
        run: |
          set -euo pipefail
          cleanup() {
            docker compose logs auth-config drasl || true
            docker compose down --remove-orphans || true
          }
          trap cleanup EXIT

          docker compose up -d drasl

          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:25585/ >/dev/null; then
              ready=true
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' mymine-auth-ci 2>/dev/null | grep -q true; then
              break
            fi
            sleep 1
          done
          test "$ready" = true

          config="$AUTH_DATA_DIR/config/config.toml"
          test -s "$config"
          if [[ "$VERIFY_MINECRAFT_OWNERSHIP" == true ]]; then
            grep -q '^RequireSkinVerification = true$' "$config"
            grep -Fq '[[RegistrationUsernamePassword.ImportExistingPlayer]]' "$config"
            awk '/^\[RegistrationUsernamePassword.CreateNewPlayer\]/{seen=1; next} seen && /^Allow = false$/{found=1; exit} END{exit !found}' "$config"
          else
            ! grep -Fq '[[RegistrationUsernamePassword.ImportExistingPlayer]]' "$config"
            ! grep -q '^RequireSkinVerification = true$' "$config"
            awk '/^\[RegistrationUsernamePassword.CreateNewPlayer\]/{seen=1; next} seen && /^Allow = true$/{found=1; exit} END{exit !found}' "$config"
          fi

          curl -fsS --max-time 5 http://127.0.0.1:25585/ >/dev/null
          curl -fsS --max-time 5 http://127.0.0.1:25585/discovery/minecraft/client |
            jq -er '.discovery.session.endpoints.verify.uri | contains("/session/minecraft/hasJoined")' | grep -qx true
          trap - EXIT
          cleanup

  server-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTH_DOMAIN: localhost
      AUTH_BASE_URL: http://localhost:25585
      DRASL_ADMIN: ci-admin
      AUTH_PORT: '25585'
      AUTH_CONTAINER_NAME: mymine-auth-smoke
      VERIFY_MINECRAFT_OWNERSHIP: 'false'
      DRASL_REQUIRE_INVITE: 'false'
      MC_ADDRESS: localhost:25565
      CONTAINER_NAME: mymine-test
      WEB_BIND_ADDR: 127.0.0.1
      BLUEMAP_ACCEPT_DOWNLOAD: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Boot Minecraft with public mod set
        env:
          AUTH_DATA_DIR: ${{ runner.temp }}/mymine-auth-smoke
          DATA_DIR: ${{ runner.temp }}/mymine-data-smoke
        run: |
          set -euo pipefail
          cleanup() {
            docker compose -f compose.yml -f compose.dev.yml logs minecraft drasl || true
            docker compose -f compose.yml -f compose.dev.yml down --remove-orphans || true
          }
          trap cleanup EXIT
          ./scripts/smoke-test.sh
          trap - EXIT
          cleanup

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build MyMine Launcher
        env:
          HMCL_VERSION: '3.16.4'
          MYMINE_AUTH_URL: https://auth.example.org/
          MYMINE_SERVER_NAME: MyMine CI
          MYMINE_SERVER_ADDRESS: mc.example.org:25565
          DIST_DIR: ${{ runner.temp }}/mymine-launcher
        run: ./launcher/build.sh
      - name: Verify launcher branding and embedded instance defaults
        run: |
          set -euo pipefail
          dist="${RUNNER_TEMP}/mymine-launcher"
          props=$(python3 -c 'import sys,zipfile; print(zipfile.ZipFile(sys.argv[1]).read("mymine-instance.properties").decode(), end="")' "$dist/MyMineLauncher-3.16.4.jar")
          grep -q '^auth.url=https://auth.example.org/$' <<<"$props"
          grep -q '^server.name=MyMine CI$' <<<"$props"
          grep -q '^server.address=mc.example.org:25565$' <<<"$props"
          grep -q '^edition=classic$' <<<"$props"


          # The launcher ships a reproducible Modrinth manifest, not proprietary packs.
          python3 - "$dist" <<'PY_PACK'
          import json
          import sys
          import zipfile
          from pathlib import Path
          dist = Path(sys.argv[1])
          with zipfile.ZipFile(dist / "MyMineLauncher-3.16.4.jar") as artifact:
              entries = artifact.read("mymine-client-files.tsv").decode().splitlines()
              assert len([line for line in entries if line and not line.startswith("#")]) >= 16
              assert "org/jackhuang/hmcl/game/MyMineClientPacks.class" in artifact.namelist()
              assert "mymine-engineering.mrpack" in artifact.namelist()
              with zipfile.ZipFile(__import__("io").BytesIO(artifact.read("mymine-engineering.mrpack"))) as embedded:
                  idx = json.loads(embedded.read("modrinth.index.json"))
                  assert idx["dependencies"]["minecraft"] == "1.21.1"
                  assert idx["dependencies"]["neoforge"] == "21.1.265"
                  assert len(idx["files"]) == 9

          with zipfile.ZipFile(dist / "MyMine-26.3.mrpack") as pack:
              index = json.loads(pack.read("modrinth.index.json"))
              assert index["dependencies"]["minecraft"] == "26.3"
              assert index["dependencies"]["fabric-loader"] == "0.20.1"
              paths = [file["path"] for file in index["files"]]
              assert any(name.startswith("mods/iris-") for name in paths)
              assert any(name.startswith("shaderpacks/") for name in paths)
              assert any(name.startswith("resourcepacks/") for name in paths)
              assert all(file["downloads"][0].startswith("https://cdn.modrinth.com/") for file in index["files"])
          PY_PACK

          deb="$dist/MyMineLauncher-3.16.4.deb"
          test "$(dpkg-deb -f "$deb" Package)" = mymine-launcher
          test "$(dpkg-deb -f "$deb" Description | head -1)" = 'MyMine Launcher'
          root="${RUNNER_TEMP}/mymine-deb-root"
          rm -rf "$root"
          dpkg-deb -x "$deb" "$root"
          test -x "$root/usr/bin/mymine-launcher"
          test -f "$root/usr/share/applications/mymine-launcher.desktop"
          grep -q '^Name=MyMine Launcher$' "$root/usr/share/applications/mymine-launcher.desktop"
          test -f "$root/usr/share/java/mymine-launcher/MyMineLauncher-3.16.4.sh"

      - name: Verify landing injects its own instance into every launcher artifact
        run: |
          set -euo pipefail
          dist="${RUNNER_TEMP}/mymine-launcher"
          cp "$dist"/* landing/downloads/
          docker build -f landing/Dockerfile -t mymine-landing-instance-test .

          # Edition changes the landing and never requires editing game version.
          docker run --rm --entrypoint /bin/sh             -e MYMINE_EDITION=engineering             -e LANDING_TEMPLATE=showcase             -e AUTH_BASE_URL=https://auth.fork.example             -e MC_ADDRESS=play.fork.example:25577             mymine-landing-instance-test -ec '
              /docker-entrypoint.d/20-mymine-env.sh
              grep -Fq "\"version\":\"1.21.1\"" /usr/share/nginx/html/server.json
              grep -Fq "\"edition\":\"engineering\"" /usr/share/nginx/html/server.json
              grep -Fq "MyMine Engineering" /usr/share/nginx/html/index.html
              grep -Fq "/downloads/MyMine-Engineering-0.1.0.mrpack" /usr/share/nginx/html/index.html
              ! grep -Fq "Vanilla client" /usr/share/nginx/html/index.html
            '

          for template in showcase adventure atlas modern terminal classic; do
            docker run --rm --entrypoint /bin/sh \
              -e AUTH_BASE_URL=https://auth.fork.example \
              -e MC_ADDRESS=play.fork.example:25577 \
              -e SERVER_NAME='Fork Mine' \
              -e VERIFY_MINECRAFT_OWNERSHIP=false \
              -e LANDING_TEMPLATE="$template" \
              -e MC_VERSION=26.2 \
              -e HMCL_VERSION=3.16.3 \
              mymine-landing-instance-test -ec '
                set -x
                /docker-entrypoint.d/20-mymine-env.sh
                cat /usr/share/nginx/html/server.json
                test -s /usr/share/nginx/html/index.html
                grep -Fq "\"version\":\"26.3\"" /usr/share/nginx/html/server.json
                grep -Fq "play.fork.example:25577" /usr/share/nginx/html/index.html
                grep -Fq "/downloads/MyMineLauncher-3.16.4.jar" /usr/share/nginx/html/index.html
                ! grep -Fq "MyMineLauncher-3.16.3" /usr/share/nginx/html/index.html
                grep -Fq "\"template\":\"$LANDING_TEMPLATE\"" /usr/share/nginx/html/server.json
                test -s /usr/share/nginx/html/assets/ATTRIBUTION.txt
                test -s /usr/share/nginx/html/assets/voxel-world.webp
                test -s /usr/share/nginx/html/assets/isometric-world.webp
                test -s /usr/share/nginx/html/assets/bluemap.webp
              '
          done

          docker run --rm --entrypoint /bin/sh \
            -e AUTH_BASE_URL=https://auth.fork.example \
            -e MC_ADDRESS=play.fork.example:25577 \
            -e LANDING_TEMPLATE=showcase \
            -e LANDING_HERO_IMAGE=/custom/hero.webp \
            -e LANDING_GALLERY_IMAGE_1=/custom/night.webp \
            -e LANDING_GALLERY_IMAGE_2=/custom/river.webp \
            -e LANDING_GALLERY_IMAGE_3=/custom/rainbow.webp \
            mymine-landing-instance-test -ec '
              /docker-entrypoint.d/20-mymine-env.sh
              grep -Fq "/custom/hero.webp" /usr/share/nginx/html/index.html
              grep -Fq "/custom/night.webp" /usr/share/nginx/html/index.html
              grep -Fq "/custom/river.webp" /usr/share/nginx/html/index.html
              grep -Fq "/custom/rainbow.webp" /usr/share/nginx/html/index.html
            '

          if docker run --rm --entrypoint /bin/sh \
            -e AUTH_BASE_URL=https://auth.fork.example \
            -e MC_ADDRESS=play.fork.example:25577 \
            -e LANDING_TEMPLATE=not-a-template \
            mymine-landing-instance-test -ec '/docker-entrypoint.d/20-mymine-env.sh'; then
            echo 'Unknown landing template unexpectedly succeeded' >&2
            exit 1
          fi

          cid=$(docker run -d \
            -e AUTH_BASE_URL=https://auth.fork.example \
            -e MC_ADDRESS=play.fork.example:25577 \
            -e SERVER_NAME='Fork Mine' \
            -e VERIFY_MINECRAFT_OWNERSHIP=false \
            -e HMCL_VERSION=3.16.3 \
            mymine-landing-instance-test)
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            if docker exec "$cid" test -s /usr/share/nginx/html/server.json 2>/dev/null; then
              ready=true
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null | grep -q true; then
              docker logs "$cid" || true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker exec "$cid" grep -Fq '/downloads/MyMineLauncher-3.16.4.jar' /usr/share/nginx/html/index.html
          docker logs "$cid"

          out="${RUNNER_TEMP}/mymine-instance-downloads"
          rm -rf "$out" && mkdir -p "$out"
          docker cp "$cid:/usr/share/nginx/html/downloads/." "$out/"

          for ext in exe jar sh; do
            artifact="$out/MyMineLauncher-3.16.4.$ext"
            props=$(python3 -c 'import sys,zipfile; print(zipfile.ZipFile(sys.argv[1]).read("mymine-instance.properties").decode(), end="")' "$artifact")
            grep -q '^auth.url=https://auth.fork.example/$' <<<"$props"
            grep -q '^server.name=Fork Mine$' <<<"$props"
            grep -q '^server.address=play.fork.example:25577$' <<<"$props"
          done
          python3 - "$out" <<'PY_HEADERS'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          assert (root / "MyMineLauncher-3.16.4.exe").read_bytes().startswith(b"MZ")
          assert (root / "MyMineLauncher-3.16.4.sh").read_bytes().startswith(b"#!/")
          assert (root / "MyMineLauncher-3.16.4.jar").read_bytes().startswith(b"PK\x03\x04")
          PY_HEADERS

          debroot="${RUNNER_TEMP}/mymine-instance-deb"
          rm -rf "$debroot"
          dpkg-deb -x "$out/MyMineLauncher-3.16.4.deb" "$debroot"
          payload="$debroot/usr/share/java/mymine-launcher/MyMineLauncher-3.16.4.sh"
          test -x "$payload"
          props=$(python3 -c 'import sys,zipfile; print(zipfile.ZipFile(sys.argv[1]).read("mymine-instance.properties").decode(), end="")' "$payload")
          grep -q '^auth.url=https://auth.fork.example/$' <<<"$props"
          grep -q '^server.name=Fork Mine$' <<<"$props"
          grep -q '^server.address=play.fork.example:25577$' <<<"$props"

          (cd "$out" && sha256sum -c SHA256SUMS)
          trap - EXIT
          cleanup

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            context: .
            dockerfile: ./Dockerfile
            tag: mymine:ci
          - name: engineering-server
            context: .
            dockerfile: ./engineering/Dockerfile
            tag: mymine-engineering:ci
          - name: landing
            context: .
            dockerfile: ./landing/Dockerfile
            tag: mymine-landing:ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.tag }}
