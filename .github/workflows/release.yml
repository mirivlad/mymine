name: Release images

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  publish-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: server, context: ., image: mymine }
          - { name: landing, context: ./landing, image: mymine-landing }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mirivlad/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  bootstrap-v0-1-0:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release v0.1.0]')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: server, context: ., image: mymine }
          - { name: landing, context: ./landing, image: mymine-landing }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/mirivlad/${{ matrix.image }}:0.1.0
            ghcr.io/mirivlad/${{ matrix.image }}:0.1
            ghcr.io/mirivlad/${{ matrix.image }}:latest

  create-v0-1-0-tag:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release v0.1.0]')
    needs: bootstrap-v0-1-0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release tag
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a v0.1.0 -m 'MyMine v0.1.0'
          git push origin v0.1.0
