name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  HMCL_VERSION: '3.16.3'
  MYMINE_AUTH_URL: https://auth.mymine.mirv.top/

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build MyMine Launcher
        env:
          DIST_DIR: ${{ runner.temp }}/mymine-launcher
        run: ./launcher/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mymine-launcher
          path: ${{ runner.temp }}/mymine-launcher/
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mirivlad/mymine
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  landing:
    needs: launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mymine-launcher
          path: landing/downloads
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mirivlad/mymine-landing
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./landing
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release-assets:
    needs: [launcher, server, landing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mymine-launcher
          path: ${{ runner.temp }}/mymine-launcher
      - name: Publish launcher files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "MyMine $GITHUB_REF_NAME" \
              --notes "MyMine server, landing and preconfigured MyMine Launcher."
          gh release upload "$GITHUB_REF_NAME" \
            "${RUNNER_TEMP}/mymine-launcher/"* --clobber
